<div class="container mt-4">

<h3>Mis citas</h3>
<!--<pre>{{ citas | json }}</pre> -->

    <div class="card mt-4">
        <div class="card-body">
            <h5 class="card-title">Cargar archivo de citas</h5>

            <p class="card-text">Selecciona el archivo</p>

            <input (change)="seleccionarArchivo($event)" type="file" class="form-control" accept=".xlsx, .xls, .csv">

            <button (click)="procesarArchivo()" type="button" class="btn btn-primary mt-3">Cargar citas</button>

            <!-- Mensaje mientras se procesa el archivo -->
             @if (procesandoArchivo){
                <div class="alert alert-info mt-3">
                    Procesando archivo, por favor espere...
                </div>
             }


        </div>
    </div>

</div>
